name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 nose

      - name: Lint with flake8
        run: flake8 app.py test_app.py

      - name: Run unit tests with nose
        run: |
          python -c 'import collections, collections.abc, nose.core, sys; collections.Callable = collections.abc.Callable; sys.argv = ["nosetests", "-v"]; nose.core.main()'

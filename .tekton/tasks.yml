apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup-message
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        echo "Cleanup task completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-and-test
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir flake8 nose
        flake8 app.py test_app.py
        python -c 'import collections, collections.abc, nose.core, sys; collections.Callable = collections.abc.Callable; sys.argv = ["nosetests", "-v"]; nose.core.main()'